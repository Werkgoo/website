<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Illustration: Theorieunterricht mit Verkehrszeichen">
  <rect x="0" y="0" width="640" height="400" rx="20" fill="#eef3f8"/>
  <!-- board -->
  <rect x="90" y="60" width="360" height="220" rx="14" fill="#0e2a47"/>
  <rect x="106" y="76" width="328" height="188" rx="8" fill="#16385d"/>
  <rect x="240" y="280" width="60" height="14" rx="6" fill="#0e2a47"/>
  <!-- content on board -->
  <text x="130" y="120" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Theorie</text>
  <line x1="130" y1="140" x2="300" y2="140" stroke="#ffb400" stroke-width="4" stroke-linecap="round"/>
  <line x1="130" y1="168" x2="380" y2="168" stroke="#8aa5c0" stroke-width="6" stroke-linecap="round"/>
  <line x1="130" y1="192" x2="340" y2="192" stroke="#8aa5c0" stroke-width="6" stroke-linecap="round"/>
  <line x1="130" y1="216" x2="368" y2="216" stroke="#8aa5c0" stroke-width="6" stroke-linecap="round"/>
  <!-- traffic light -->
  <rect x="486" y="88" width="54" height="140" rx="14" fill="#0e2a47"/>
  <circle cx="513" cy="118" r="14" fill="#e2574c"/>
  <circle cx="513" cy="158" r="14" fill="#ffb400"/>
  <circle cx="513" cy="198" r="14" fill="#5cb85c"/>
  <rect x="507" y="228" width="12" height="80" fill="#0e2a47"/>
  <!-- vorfahrt sign -->
  <g transform="translate(180 320)">
    <rect x="-30" y="-30" width="60" height="60" rx="10" transform="rotate(45)" fill="#ffb400" stroke="#ffffff" stroke-width="6"/>
  </g>
  <rect x="176" y="352" width="9" height="40" fill="#0e2a47"/>
  <!-- stop sign -->
  <g transform="translate(390 330)">
    <polygon points="14,-32 -14,-32 -32,-14 -32,14 -14,32 14,32 32,14 32,-14" fill="#c0392b" stroke="#ffffff" stroke-width="5"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#ffffff">STOP</text>
  </g>
  <rect x="386" y="362" width="9" height="30" fill="#0e2a47"/>
</svg>
