<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="Illustration: Fahrschulauto mit FAHRSCHULE-Dachschild in der Stadt">
  <defs>
    <linearGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffb400" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb400" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb400" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffb400" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sun glow -->
  <circle cx="580" cy="90" r="130" fill="url(#sun)"/>
  <circle cx="580" cy="90" r="42" fill="#ffb400" opacity="0.9"/>

  <!-- skyline -->
  <g fill="#16385d">
    <rect x="30" y="150" width="70" height="160" rx="4"/>
    <rect x="115" y="110" width="90" height="200" rx="4"/>
    <rect x="220" y="170" width="60" height="140" rx="4"/>
    <rect x="295" y="130" width="85" height="180" rx="4"/>
    <rect x="395" y="185" width="55" height="125" rx="4"/>
    <rect x="465" y="145" width="80" height="165" rx="4"/>
    <rect x="560" y="180" width="65" height="130" rx="4"/>
    <rect x="640" y="150" width="55" height="160" rx="4"/>
  </g>
  <!-- windows in skyline -->
  <g fill="#2c4f7c" opacity="0.9">
    <rect x="128" y="128" width="14" height="14" rx="2"/><rect x="152" y="128" width="14" height="14" rx="2"/><rect x="176" y="128" width="14" height="14" rx="2"/>
    <rect x="128" y="156" width="14" height="14" rx="2"/><rect x="152" y="156" width="14" height="14" rx="2"/><rect x="176" y="156" width="14" height="14" rx="2"/>
    <rect x="308" y="148" width="13" height="13" rx="2"/><rect x="331" y="148" width="13" height="13" rx="2"/><rect x="354" y="148" width="13" height="13" rx="2"/>
    <rect x="308" y="174" width="13" height="13" rx="2"/><rect x="331" y="174" width="13" height="13" rx="2"/><rect x="354" y="174" width="13" height="13" rx="2"/>
    <rect x="478" y="162" width="13" height="13" rx="2"/><rect x="501" y="162" width="13" height="13" rx="2"/><rect x="524" y="162" width="13" height="13" rx="2"/>
    <rect x="478" y="188" width="13" height="13" rx="2"/><rect x="501" y="188" width="13" height="13" rx="2"/>
  </g>

  <!-- road -->
  <rect x="0" y="310" width="720" height="90" rx="8" fill="#081b30"/>
  <g stroke="#ffb400" stroke-width="6" stroke-dasharray="34 26">
    <line x1="10" y1="356" x2="710" y2="356"/>
  </g>

  <!-- car shadow -->
  <ellipse cx="360" cy="330" rx="190" ry="14" fill="#000000" opacity="0.35"/>

  <!-- roof sign -->
  <g>
    <rect x="288" y="128" width="146" height="40" rx="9" fill="#ffb400"/>
    <text x="361" y="155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" letter-spacing="1" fill="#0e2a47">FAHRSCHULE</text>
    <rect x="352" y="166" width="18" height="30" fill="#ffb400"/>
  </g>

  <!-- car body -->
  <g>
    <!-- cabin -->
    <path d="M235 246 q10 -52 62 -58 l118 0 q52 6 66 58 z" fill="#f4f7fa"/>
    <!-- windows -->
    <path d="M252 240 q12 -38 50 -42 l50 0 0 42 z" fill="#0e2a47"/>
    <path d="M366 198 l44 0 q38 4 52 42 l-96 0 z" fill="#0e2a47"/>
    <!-- lower body -->
    <rect x="180" y="242" width="360" height="62" rx="24" fill="#ffffff"/>
    <!-- door line -->
    <path d="M360 200 l0 100" stroke="#c8d4e0" stroke-width="4"/>
    <path d="M360 262 l-30 0" stroke="#c8d4e0" stroke-width="4" stroke-linecap="round"/>
    <!-- side stripe -->
    <rect x="190" y="270" width="340" height="10" rx="5" fill="#ffb400"/>
    <!-- branding -->
    <text x="285" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="1" fill="#0e2a47">GRAFWEG</text>
    <!-- lights -->
    <rect x="182" y="252" width="16" height="12" rx="4" fill="#ffd670"/>
    <rect x="522" y="252" width="16" height="12" rx="4" fill="#e2574c"/>
    <!-- L-Schild style badge -->
    <circle cx="360" cy="228" r="0" fill="none"/>
    <!-- wheels -->
    <circle cx="262" cy="306" r="30" fill="#0e2a47"/>
    <circle cx="262" cy="306" r="13" fill="#dbe6f1"/>
    <circle cx="458" cy="306" r="30" fill="#0e2a47"/>
    <circle cx="458" cy="306" r="13" fill="#dbe6f1"/>
  </g>
</svg>
