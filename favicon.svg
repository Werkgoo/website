<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#E8C767"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0A0806"/>
  <!-- ruitvorm uit het logo: dubbele omlijning met een massieve ruit in het hart -->
  <g fill="none" stroke="url(#g)" stroke-linejoin="round">
    <rect x="16" y="4.4" width="16.4" height="16.4" rx="1.2"
          transform="rotate(45 16 4.4)" stroke-width="1.5"/>
    <rect x="16" y="7.6" width="11.9" height="11.9" rx="1"
          transform="rotate(45 16 7.6)" stroke-width="1"/>
  </g>
  <rect x="16" y="11.4" width="6.5" height="6.5" rx=".8"
        transform="rotate(45 16 11.4)" fill="url(#g)"/>
</svg>
