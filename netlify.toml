[build]
  publish = "."
  branch = "main"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://formspree.io; frame-src https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formspree.io"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# De losse pagina's zijn samengevoegd tot een homepage; oude links blijven werken.
[[redirects]]
  from = "/diensten"
  to = "/#prijzen"
  status = 301

[[redirects]]
  from = "/prijzen"
  to = "/#prijzen"
  status = 301

[[redirects]]
  from = "/werk"
  to = "/#werk"
  status = 301

[[redirects]]
  from = "/over"
  to = "/#praktisch"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/#afspraak"
  status = 301
