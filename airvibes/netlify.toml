# AirVibes — Netlify configuratie
# Netlify-project: zet "Base directory" op `airvibes`.
# De site staat in `public/`, de reserverings-API in `netlify/functions/`.

[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/beheer"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS en JS altijd opnieuw valideren, zodat bezoekers na een wijziging
# nooit met een verouderde opmaak blijven zitten
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/partytenten"
  to = "/partytenten.html"
  status = 200

[[redirects]]
  from = "/springkussens"
  to = "/springkussens.html"
  status = 200

[[redirects]]
  from = "/feestartikelen"
  to = "/feestartikelen.html"
  status = 200

[[redirects]]
  from = "/over-ons"
  to = "/over-ons.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/bedankt"
  to = "/bedankt.html"
  status = 200

[[redirects]]
  from = "/beheer"
  to = "/beheer.html"
  status = 200

[[redirects]]
  from = "/verhuur"
  to = "/feestartikelen"
  status = 301
