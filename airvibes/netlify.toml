# AirVibes — Netlify configuratie
# Nieuw Netlify-project: zet "Base directory" op `airvibes`,
# dan wordt dit bestand automatisch gebruikt.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/partytenten"
  to = "/partytenten.html"
  status = 200

[[redirects]]
  from = "/springkussens"
  to = "/springkussens.html"
  status = 200

[[redirects]]
  from = "/feestartikelen"
  to = "/feestartikelen.html"
  status = 200

[[redirects]]
  from = "/over-ons"
  to = "/over-ons.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/bedankt"
  to = "/bedankt.html"
  status = 200

[[redirects]]
  from = "/verhuur"
  to = "/feestartikelen"
  status = 301
